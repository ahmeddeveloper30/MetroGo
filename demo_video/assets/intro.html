<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>Smart Metro — Intro</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0A1B33; font-family: 'IBM Plex Sans Arabic', 'Segoe UI', sans-serif; }
  .stage { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
  .glow { position: absolute; border-radius: 9999px; filter: blur(120px); opacity: .3; }
  .g1 { width: 500px; height: 500px; background: #E72434; top: -160px; right: 20%; animation: drift 9s ease-in-out infinite; }
  .g2 { width: 420px; height: 420px; background: #0055A5; bottom: -140px; left: 15%; animation: drift 11s ease-in-out infinite reverse; }
  @keyframes drift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(36px); } }

  .mark { width: 120px; height: 120px; border-radius: 32px; background: linear-gradient(135deg, #E72434, #B01030); display: grid; place-items: center; box-shadow: 0 24px 60px rgba(231,36,52,.4); animation: pop .8s cubic-bezier(.34,1.56,.64,1) both; }
  .mark span { font-size: 58px; font-weight: 800; }
  @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  h1 { margin-top: 34px; font-size: 64px; font-weight: 800; letter-spacing: 2px; animation: rise .7s .35s ease-out both; }
  h2 { margin-top: 10px; font-size: 30px; font-weight: 600; color: rgba(255,255,255,.85); animation: rise .7s .65s ease-out both; }
  .lines { display: flex; gap: 18px; margin-top: 42px; animation: rise .7s .95s ease-out both; }
  .lines i { width: 14px; height: 14px; border-radius: 9999px; animation: pulse 2.2s ease-in-out infinite; box-shadow: 0 0 14px currentColor; }
  .lines i:nth-child(1){ background:#E72434; color:#E72434; }
  .lines i:nth-child(2){ background:#0055A5; color:#0055A5; animation-delay:.25s; }
  .lines i:nth-child(3){ background:#009640; color:#009640; animation-delay:.5s; }
  .lines i:nth-child(4){ background:#F2B21B; color:#F2B21B; animation-delay:.75s; }
  .lines i:nth-child(5){ background:#E87722; color:#E87722; animation-delay:1s; }
  .lines i:nth-child(6){ background:#9AA5B1; color:#9AA5B1; animation-delay:1.25s; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.35); opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
  <div class="stage">
    <div class="glow g1"></div><div class="glow g2"></div>
    <div class="mark"><span>M</span></div>
    <h1>Smart Metro</h1>
    <h2>نظام ذكي لتسهيل التنقل عبر مترو القاهرة</h2>
    <div class="lines"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
</body>
</html>
