<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>Smart Metro — Closing</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0A1B33; font-family: 'IBM Plex Sans Arabic', 'Segoe UI', sans-serif; }
  .stage { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
  .glow { position: absolute; border-radius: 9999px; filter: blur(120px); opacity: .3; }
  .g1 { width: 520px; height: 520px; background: #E72434; top: -170px; left: 22%; animation: drift 9s ease-in-out infinite; }
  .g2 { width: 420px; height: 420px; background: #009640; bottom: -150px; right: 18%; animation: drift 11s ease-in-out infinite reverse; }
  @keyframes drift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(36px); } }

  h1 { font-size: 62px; font-weight: 800; letter-spacing: 2px; animation: rise .7s .1s ease-out both; }
  h2 { margin-top: 16px; font-size: 36px; font-weight: 800; color: #fff; animation: rise .7s .5s ease-out both; }
  .tagline { margin-top: 34px; padding: 14px 44px; border-radius: 9999px; background: rgba(231,36,52,.14); border: 1px solid rgba(231,36,52,.45); font-size: 27px; font-weight: 800; animation: rise .7s .9s ease-out both; }
  .lines { display: flex; gap: 18px; margin-top: 40px; animation: rise .7s 1.15s ease-out both; }
  .lines i { width: 13px; height: 13px; border-radius: 9999px; animation: pulse 2.2s ease-in-out infinite; box-shadow: 0 0 14px currentColor; }
  .lines i:nth-child(1){ background:#E72434; color:#E72434; }
  .lines i:nth-child(2){ background:#0055A5; color:#0055A5; animation-delay:.25s; }
  .lines i:nth-child(3){ background:#009640; color:#009640; animation-delay:.5s; }
  .lines i:nth-child(4){ background:#F2B21B; color:#F2B21B; animation-delay:.75s; }
  .lines i:nth-child(5){ background:#E87722; color:#E87722; animation-delay:1s; }
  .lines i:nth-child(6){ background:#9AA5B1; color:#9AA5B1; animation-delay:1.25s; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.35); opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
  <div class="stage">
    <div class="glow g1"></div><div class="glow g2"></div>
    <h1>Smart Metro</h1>
    <h2>رحلة أذكى... تنقل أسهل</h2>
    <div class="tagline">مشروع تخرج — ٢٠٢٦</div>
    <div class="lines"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
</body>
</html>
